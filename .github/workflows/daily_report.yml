name: Hyperliquid Daily Report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 * * *"

jobs:

  daily-report:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pandas numpy

      - name: Run Hyperliquid report
        env:
          HYPERLIQUID_WALLET: ${{ secrets.HYPERLIQUID_WALLET }}
        run: |
          python hyperliquid_report.py

      - name: Upload daily report
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-daily-report
          path: hyperliquid_daily_report.txt

      - name: Upload account history
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-account-history
          path: account_history.csv
