name: Hyperliquid Daily Report

on:
  workflow_dispatch:

jobs:
  daily-report:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show exactly what GitHub downloaded
        run: |
          echo "===================================="
          echo "COMMIT BEING RUN:"
          git rev-parse HEAD
          echo "===================================="

          echo "FILES:"
          ls -la

          echo "===================================="
          echo "PYTHON FILE:"
          cat hyperliquid_report.py
          echo "===================================="

      - name: Run Python
        env:
          HYPERLIQUID_WALLET: ${{ secrets.HYPERLIQUID_WALLET }}
        run: |
          python hyperliquid_report.py
